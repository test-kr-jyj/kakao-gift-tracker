name: 카카오 선물하기 랭킹 수집

# 언제 실행할지
on:
  schedule:
    - cron: "13,33,53 * * * *"  # 매시 13·33·53분 3회(한산한 시각). 몇 번 건너뛰어도 한 번은 잡히게 → 시간당 누락 최소화. (그래프는 시간당 1점으로 자동 정리)
  workflow_dispatch:          # 깃허브에서 "Run workflow" 버튼으로 수동 실행 (첫 보정용)
    inputs:
      debug:
        description: "디버그 모드로 실행 (처음 1회 데이터 구조 확인용)"
        type: boolean
        default: false

# 수집한 데이터를 저장소에 다시 커밋하려면 쓰기 권한 필요
permissions:
  contents: write

# 같은 시각 중복 실행 방지
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 브라우저(크로미움) 설치
        run: python -m playwright install --with-deps chromium

      - name: 랭킹 수집 실행
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python collector.py --debug
          else
            python collector.py
          fi

      - name: 수집 결과 저장(커밋)
        run: |
          git config user.name  "kakao-gift-bot"
          git config user.email "bot@users.noreply.github.com"
          # 대시보드가 쓰는 JSON/CSV만 커밋 (sqlite는 커밋 안 함 → 저장소 경량화·충돌 감소)
          git add data/*.json data/*.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 사항 없음 (저장 생략)"; exit 0
          fi
          git commit -m "랭킹 수집: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 다른 실행이 먼저 저장해 충돌해도 절대 실패하지 않게: 우리 데이터를 유지하며 병합 후 push
          for i in 1 2 3 4 5 6; do
            if git push; then echo "저장 성공"; exit 0; fi
            echo "원격이 앞섬 → 우리 데이터 유지하며 병합 후 재시도 $i"
            git fetch origin main || true
            git merge -s ours origin/main -m "auto-merge (keep ours)" || true
            sleep 3
          done
          echo "저장 실패(재시도 초과)"; exit 1
